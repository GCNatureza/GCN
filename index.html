<style>
:root{
  --tinta:#062229; --petroleo:#0f4552; --petroleo-2:#166273; --petroleo-3:#2a8ba1;
  --ouro:#d9a441; --ouro-claro:#f0c96b;
  --papel:#e9eef0; --papel-2:#f7fafb; --linha:#c3d2d7;
  --acerto:#2f8f6b; --erro:#c25543; --neutro:#6b8189;
  --display:"Bricolage Grotesque","Archivo",system-ui,sans-serif;
  --corpo:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--corpo);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}

header.topo{background:var(--petroleo);color:#fff;border-bottom:3px solid var(--ouro)}
.topo-in{max-width:900px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.marca{background:#fff;padding:7px 11px;border-radius:7px;line-height:0;user-select:none;cursor:default;
  box-shadow:0 1px 0 rgba(255,255,255,.25)}
.marca img{width:74px;height:auto;display:block}
@media(max-width:480px){.marca img{width:62px}.marca{padding:6px 9px}}
.selo-abertura{margin:0 0 22px}
.selo-abertura img{width:min(300px,72vw);height:auto;display:block}
.marca-txt{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em}
.marca-sub{font-size:12.5px;color:#a9c9d2;font-family:var(--mono);letter-spacing:.02em}
.topo-acoes{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.passos{display:flex;margin:24px 0 28px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;flex-wrap:wrap}
.passo{padding:7px 14px 7px 0;color:var(--neutro);display:flex;align-items:center;gap:8px}
.passo::after{content:"";width:22px;height:1px;background:var(--linha);margin-left:12px}
.passo:last-child::after{display:none}
.passo b{font-weight:700}
.passo.on{color:var(--petroleo)} .passo.on .bolha{background:var(--ouro);border-color:var(--ouro);color:var(--tinta)}
.passo.feito{color:var(--acerto)} .passo.feito .bolha{background:var(--acerto);border-color:var(--acerto);color:#fff}
.bolha{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--linha);display:grid;place-items:center;font-size:10px;font-weight:700;background:#fff}

h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.08;letter-spacing:-.025em;margin:0 0 10px}
h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.015em;margin:0 0 4px}
h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0 0 10px}
.olho{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--petroleo-3);margin:0 0 12px;font-weight:700}
.lead{font-size:16.5px;color:#3b5a63;max-width:62ch;margin:0 0 24px}
.dica{font-size:13.5px;color:var(--neutro);margin:8px 0 0}

.card{background:#fff;border:1px solid var(--linha);border-radius:var(--r);padding:22px;margin-bottom:18px}
.card.escuro{background:var(--petroleo);color:#fff;border-color:var(--petroleo)}
.card.escuro h2,.card.escuro h3{color:#fff}
.card.escuro .olho{color:var(--ouro-claro)}
.card.destaque{border:1.5px solid var(--ouro);background:#fffdf6}

label.rot{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--petroleo);font-weight:700;margin:0 0 7px}
input[type=text],select{width:100%;padding:12px 13px;font-family:var(--corpo);font-size:16px;border:1.5px solid var(--linha);border-radius:8px;background:var(--papel-2);color:var(--tinta)}
input[type=text]:focus,select:focus{outline:2px solid var(--ouro);outline-offset:1px;border-color:var(--petroleo-2)}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:620px){.grade2{grid-template-columns:1fr}}

.opcoes{display:flex;gap:10px;flex-wrap:wrap}
.opcao{flex:1 1 200px;border:1.5px solid var(--linha);border-radius:8px;padding:12px 14px;cursor:pointer;background:var(--papel-2);transition:border-color .12s,background .12s}
.opcao:hover{border-color:var(--petroleo-3)}
.opcao.sel{border-color:var(--petroleo);background:#e6f1f4;box-shadow:inset 0 0 0 1px var(--petroleo)}
.opcao b{display:block;font-family:var(--display);font-weight:600;font-size:15px}
.opcao span{font-size:13px;color:var(--neutro)}
.opcao input{position:absolute;opacity:0;pointer-events:none}

button{font-family:var(--corpo);cursor:pointer}
.btn{background:var(--petroleo);color:#fff;border:none;border-radius:8px;padding:13px 26px;font-size:15.5px;font-weight:600;transition:background .12s,transform .06s}
.btn:hover{background:var(--petroleo-2)} .btn:active{transform:translateY(1px)}
.btn:disabled{background:#9fb4bb;cursor:not-allowed}
.btn.ouro{background:var(--ouro);color:var(--tinta)} .btn.ouro:hover{background:var(--ouro-claro)}
.btn.fantasma{background:transparent;color:var(--petroleo);border:1.5px solid var(--linha)}
.btn.fantasma:hover{background:#fff;border-color:var(--petroleo-3)}
.btn.mini{padding:8px 14px;font-size:13px;border-radius:6px}
.btn.perigo{background:transparent;color:var(--erro);border:1.5px solid #eccac3}
.btn.perigo:hover{background:#fbeeec}
.topo-acoes .btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);padding:8px 14px;font-size:13px}
.topo-acoes .btn:hover{background:rgba(255,255,255,.22)}
button:focus-visible,.opcao:focus-visible,input:focus-visible,select:focus-visible,.alt:focus-visible{outline:2.5px solid var(--ouro);outline-offset:2px}
.barra-acoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}

.folha{border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;background:#fff}
.folha-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--petroleo);color:#fff;padding:12px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.linha-q{display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid #eaf0f2}
.linha-q:last-child{border-bottom:none}
.linha-q:nth-child(even){background:#fafcfc}
.num-q{font-family:var(--mono);font-weight:700;font-size:14px;width:30px;color:var(--petroleo);flex:none}
.dif-q{font-family:var(--mono);font-size:11.5px;color:var(--neutro);width:56px;flex:none;text-align:right}
.bolhas{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.bolha-alt{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--linha);background:#fff;font-family:var(--mono);font-weight:700;font-size:13px;color:var(--neutro);display:grid;place-items:center;transition:all .1s}
.bolha-alt:hover{border-color:var(--petroleo-3);color:var(--petroleo)}
.bolha-alt.on{background:var(--petroleo);border-color:var(--petroleo);color:#fff}
.tog{border-radius:7px;width:auto;padding:0 14px;height:36px;font-family:var(--corpo);font-weight:600;font-size:13.5px}
.tog.on-c{background:var(--acerto);border-color:var(--acerto);color:#fff}
.tog.on-e{background:var(--erro);border-color:var(--erro);color:#fff}

.regua svg{width:100%;height:auto;display:block;overflow:visible}
.legenda{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--neutro);margin-top:10px;text-transform:uppercase}
.legenda i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}

.numerao{font-family:var(--display);font-weight:800;font-size:clamp(46px,10vw,72px);line-height:.95;letter-spacing:-.035em;color:var(--ouro)}
.metricas{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--linha);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;margin-top:18px}
.metrica{background:#fff;padding:14px 16px}
.metrica b{display:block;font-family:var(--mono);font-size:22px;font-weight:700;color:var(--petroleo);line-height:1.2}
.metrica span{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--neutro)}

.q-cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--linha)}
.q-id{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--petroleo-3);font-weight:700}
.q-passo{font-family:var(--mono);font-size:12px;color:var(--neutro)}
.enunciado{font-size:16.5px;line-height:1.65;margin-bottom:20px}
.enunciado img{max-width:100%;height:auto;border-radius:6px;margin:12px 0}
.alts{display:flex;flex-direction:column;gap:9px}
.alt{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--linha);background:var(--papel-2);border-radius:9px;padding:13px 15px;font-family:var(--corpo);font-size:15.5px;line-height:1.5;color:var(--tinta);transition:all .12s}
.alt:hover:not(:disabled){border-color:var(--petroleo-3);background:#fff}
.alt:disabled{cursor:default}
.alt .letra{font-family:var(--mono);font-weight:700;font-size:14px;flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--linha);background:#fff;display:grid;place-items:center;color:var(--petroleo)}
.alt.sel{border-color:var(--petroleo);background:#e6f1f4}
.alt.sel .letra{background:var(--petroleo);color:#fff;border-color:var(--petroleo)}
.alt.certa{border-color:var(--acerto);background:#e9f6f1}
.alt.certa .letra{background:var(--acerto);color:#fff;border-color:var(--acerto)}
.alt.errada{border-color:var(--erro);background:#fbeeec}
.alt.errada .letra{background:var(--erro);color:#fff;border-color:var(--erro)}
.aviso{margin-top:18px;padding:14px 16px;border-radius:9px;font-size:15px;border-left:4px solid}
.aviso.ok{background:#e9f6f1;border-color:var(--acerto);color:#1d5b45}
.aviso.nao{background:#fbeeec;border-color:var(--erro);color:#8c3527}
.aviso.info{background:#eaf3f6;border-color:var(--petroleo-3);color:#134a58}

.tab{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.tab th{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--neutro);text-align:left;padding:9px 10px;border-bottom:1.5px solid var(--linha);font-weight:700}
.tab td{padding:10px;border-bottom:1px solid #edf2f3;vertical-align:middle}
.tab td.m{font-family:var(--mono);font-size:13px}
.selo{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.selo.c{background:#e9f6f1;color:#1d5b45}
.selo.e{background:#fbeeec;color:#8c3527}
.rolar{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;background:#e6f1f4;color:var(--petroleo);padding:3px 9px;border-radius:20px;letter-spacing:.04em}
.pill.alta{background:#fdf1dc;color:#8a6412}

/* mapa das 30 habilidades */
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px;margin-top:6px}
.celula{border:1.5px solid var(--linha);border-radius:7px;padding:8px 4px;text-align:center;background:var(--papel-2)}
.celula b{display:block;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--petroleo)}
.celula span{font-family:var(--mono);font-size:11px;color:var(--neutro)}
.celula.feita{background:#eaf6f1;border-color:#9dd0bb}
.celula.feita span{color:#1d5b45;font-weight:700}

.oculto{display:none !important}
.rodape{margin-top:40px;padding-top:20px;border-top:1px solid var(--linha);font-size:12.5px;color:var(--neutro);font-family:var(--mono);letter-spacing:.03em}
pre.esquema{background:var(--tinta);color:#cfe6ec;padding:16px;border-radius:8px;overflow-x:auto;font-family:var(--mono);font-size:12px;line-height:1.6}

/* questões da lista extra */
.enunciado img,.alt img{max-width:100%;height:auto;vertical-align:middle}
.enunciado img.bloco,.alt img.bloco{display:block;margin:14px auto}
.enunciado p{margin:0 0 12px}
.enunciado p:last-child{margin-bottom:0}
table.tq{border-collapse:collapse;margin:14px 0;font-size:13.5px;max-width:100%}
table.tq td{border:1px solid var(--linha);padding:6px 9px;vertical-align:middle;line-height:1.4}
table.tq tr:first-child td{background:#eef4f6;font-weight:600}
.alt table.tq{margin:6px 0}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
/* abertura */
.abertura{max-width:520px;margin:8vh auto 0}
.girando{display:inline-block;width:15px;height:15px;border:2.5px solid var(--linha);
  border-top-color:var(--ouro);border-radius:50%;animation:gira .8s linear infinite;vertical-align:-3px;margin-right:9px}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
